version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Primary Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: icms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-icms_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-icms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icms-network

  # ----------------------------------------------------------------------------
  # Redis Cache & Session Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: icms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icms-network

  # ----------------------------------------------------------------------------
  # MinIO S3-Compatible Storage (For Materials & Documents)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: icms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - icms-network

  # ----------------------------------------------------------------------------
  # Backend API (NestJS)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: icms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-icms_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    ports:
      - "4000:4000"
    networks:
      - icms-network

  # ----------------------------------------------------------------------------
  # Frontend Web Client (React + Vite)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: icms-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - icms-network

networks:
  icms-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

